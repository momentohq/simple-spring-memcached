name: CI

on:
  pull_request:
    branches: [momento]
  push:
    branches: [momento]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'maven'

      - name: Build and test
        run: mvn -B verify

      # The release build runs javadoc, sources and the delombok profile, and it deactivates the
      # activeByDefault xmemcached profile the integration tests get their sources from. None of that
      # is exercised by `mvn verify`, so check it here rather than discovering it at release time.
      - name: Verify release build
        run: mvn -B -DperformRelease=true -Dgpg.skip=true -Pxmemcached verify
